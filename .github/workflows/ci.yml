name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev,agentic]'
      - run: python -m pytest
      - if: matrix.python-version == '3.14'
        run: python -m ruff format --check src tests examples
      - if: matrix.python-version == '3.14'
        run: python -m ruff check src tests examples
      - if: matrix.python-version == '3.14'
        run: python -m mypy src/cobruh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install '.[dev,agentic]'
      - run: python -m build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          WHEEL="$(realpath dist/cobruh-0.2.0-*.whl)"
          python -m venv /tmp/cobruh-wheel
          /tmp/cobruh-wheel/bin/pip install "$WHEEL" 'mcp>=2,<3'
          cd /tmp
          /tmp/cobruh-wheel/bin/python - <<'PY'
          import asyncio
          import json
          import tempfile
          from pathlib import Path

          from mcp import Client
          from cobruh import (
              Cobruh,
              CobruhError,
              ConfigError,
              OverrideError,
              TargetError,
              __version__,
          )
          from cobruh.mcp_server import create_server
          from cobruh.skills import install_skills, list_skills

          assert __version__ == "0.2.0"
          assert all((CobruhError, ConfigError, OverrideError, TargetError))
          assert list_skills() == ["cobruh-config", "cobruh-mcp", "cobruh-runtime"]
          root = Path(tempfile.mkdtemp())
          configs = root / "configs"
          configs.mkdir()
          (configs / "config.yaml").write_text("value: 1\n", encoding="utf-8")
          assert Cobruh(configs, project_root=root).compose() == {"value": 1}
          installed = install_skills(agent="all", project=root)
          assert len(installed) == 12

          async def handshake() -> None:
              async with Client(create_server(Cobruh(configs, project_root=root))) as client:
                  tools = await client.list_tools()
                  assert len(tools.tools) == 5

          asyncio.run(handshake())
          PY
