[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cobruh"
version = "0.2.0"
description = "Explicit, composable YAML configuration for Python projects and coding agents"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [
    {name = "OpenPrism Labs"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Configuration",
    "Typing :: Typed",
]
keywords = ["configuration", "config", "yaml", "mcp", "agent-skills"]
dependencies = [
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
agentic = [
    "mcp>=2,<3",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.13,<1",
    "mypy>=1.18,<2",
    "build>=1.3,<2",
]

[project.scripts]
cobruh = "cobruh.cli:main"

[project.urls]
Homepage = "https://github.com/OpenPrism-Labs/Cobruh"
Repository = "https://github.com/OpenPrism-Labs/Cobruh"
Documentation = "https://github.com/OpenPrism-Labs/Cobruh/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cobruh = ["py.typed", "_skills/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["src/cobruh"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
