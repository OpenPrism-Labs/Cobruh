# GPU trainer configuration

_target_: lightning.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1
max_epochs: 10

accelerator: gpu
devices: 1

# mixed precision
precision: 16-mixed

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# set True to ensure deterministic results
deterministic: False
