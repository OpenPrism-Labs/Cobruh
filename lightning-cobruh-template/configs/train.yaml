# @package _global_

# Main configuration file for training
# This determines how config is composed when running: python src/train.py

defaults:
  - _self_
  - data: mnist.yaml
  - model: mnist.yaml
  - callbacks: default.yaml
  - logger: null  # set logger here or use command line (e.g. `python src/train.py logger=csv`)
  - trainer: default.yaml
  - paths: default.yaml
  - extras: default.yaml

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default.yaml

  # debugging config (enable through command line, e.g. `python src/train.py debug=default`)
  - debug: null

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
tags: ["dev"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
test: True

# checkpoint path for resuming training
ckpt_path: null

# seed for random number generators
seed: null
